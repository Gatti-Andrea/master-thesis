    output_params: []
  act_dr6_cmbonly.PlanckActCut:
    path: null
    dataset_file: plik_lite_v22.dataset
    dataset_params:
      use_cl: tt te ee
      lmin_cuts: 0 0 0
      lmax_cuts: 1000 600 600
    aliases:
    - plikHM_TTTEEE
