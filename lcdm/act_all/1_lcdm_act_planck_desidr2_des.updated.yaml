theory:
  camb:
    version: 1.5.8
    path: null
    speed: 0.3
    stop_at_error: false
    extra_args:
      theta_H0_range:
      - 20
      - 100
      halofit_version: mead2020_feedback
      lmax: 5000
      lens_margin: 1250
      lens_potential_accuracy: 4
      AccuracyBoost: 1
      lSampleBoost: 1
      lAccuracyBoost: 1
      nnu: 3.046
      num_massive_neutrinos: 1
    ignore_obsolete: false
    use_renames: false
    external_primordial_pk: false
    renames:
      omegabh2: ombh2
      omegach2: omch2
      omegal: omega_de
      omegak: omk
      yhe: YHe
      yheused: YHe
      YpBBN: Y_p
    input_params:
    - As
    - ns
    - H0
    - mnu
    - ombh2
    - omch2
    - tau
    output_params:
    - YHe
    - Y_p
    - age
    - omega_de
    - omegam
    - rdrag
    - sigma8
    - thetastar
    - zrei
    - DH
likelihood:
  planck_2018_lowl.TT:
